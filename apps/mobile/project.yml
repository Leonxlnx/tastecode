name: HarnessMobile

options:
  bundleIdPrefix: com.blueemi
  deploymentTarget:
    iOS: '26.0'
  xcodeVersion: '27.0'

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    SDKROOT: iphoneos
    SUPPORTED_PLATFORMS: 'iphoneos iphonesimulator'
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    TARGETED_DEVICE_FAMILY: '1'

targets:
  HarnessMobile:
    type: application
    platform: iOS
    sources:
      - path: Sources/HarnessMobile
      - path: Resources
        excludes:
          - Info.plist
          - AppIcon.svg
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blueemi.Harness
        PRODUCT_NAME: Harness
        PRODUCT_MODULE_NAME: HarnessMobile
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: '1'
        MARKETING_VERSION: '0.1.0'
        TARGETED_DEVICE_FAMILY: '1'
    scheme:
      testTargets:
        - HarnessMobileTests

  HarnessMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/HarnessMobileTests
    dependencies:
      - target: HarnessMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blueemi.HarnessTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: '$(BUILT_PRODUCTS_DIR)/Harness.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Harness'
        BUNDLE_LOADER: '$(TEST_HOST)'

schemes:
  HarnessMobile:
    build:
      targets:
        HarnessMobile: all
        HarnessMobileTests: [test]
    test:
      targets:
        - HarnessMobileTests
