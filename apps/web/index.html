<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Remote GitHub origins are restricted to images; API access stays on
         the local server. Native attachment previews use a signed app-local
         protocol restricted to image/video elements. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' __HARNESS_SERVER_ORIGIN__; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: tastecode-attachment: https://avatars.githubusercontent.com https://github.com https://raw.githubusercontent.com https://media.githubusercontent.com https://user-images.githubusercontent.com https://private-user-images.githubusercontent.com https://camo.githubusercontent.com; media-src 'self' blob: tastecode-attachment:"
    />
    <title>Taste Code</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
