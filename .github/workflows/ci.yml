name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes the run in flight — reviewing against a stale result is
# worse than waiting.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Both, always. A broken Windows build blocks the merge even if macOS is
    # green, and the reverse. fail-fast off so one platform's failure does not
    # hide the other's.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      # Builds the renderer and every package. Not the installer — signing and
      # packaging belong to the release workflow, not to every pull request.
      - name: Build
        run: pnpm -r build
