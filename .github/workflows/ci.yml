name: CI

on:
  workflow_dispatch:

# Hosted CI is manual to preserve the account's included Actions minutes. Local
# verification is the default; start this workflow only when Leon asks for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # When manually requested, check both platforms in one run.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      # Builds the renderer and every package. Not the installer — signing and
      # packaging belong to the release workflow, not to every pull request.
      - name: Build
        run: pnpm -r build
