name: Release artifact proof

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact 40-character main commit approved for packaging proof
        required: true
        type: string
      upload_draft:
        description: Also upload verified unsigned proof to one draft (never publish)
        required: true
        default: false
        type: boolean

# Hosted Actions are manual. This group serializes every managed release writer, across tags.
# The default run only produces workflow artifacts. Signed distribution is a separate owner gate.
permissions:
  contents: read

concurrency:
  group: release-artifact-proof
  cancel-in-progress: false

env:
  APPROVED_SHA: ${{ inputs.approved_sha }}
  EVENT_SHA: ${{ github.sha }}
  EVENT_REF: ${{ github.ref }}

jobs:
  verify-input:
    if: github.ref == 'refs/heads/main' && inputs.approved_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter .
      - name: Verify approved source
        run: node tools/scripts/verify-release-input.js

  package:
    needs: verify-input
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows
            label: windows-x64
          - os: macos-15
            platform: macos
            label: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.approved_sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: node tools/scripts/verify-release-input.js
      - run: pnpm licenses:verify
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Build preload
        run: pnpm --filter @harness/desktop exec node scripts/build-preload.js
      - name: Build fresh unsigned package and prove licenses, feed, native bindings, and containers
        run: node tools/scripts/verify-release-assets.js --package release/proof-${{ matrix.label }} ${{ matrix.platform }}
      - name: Stage the exact verified platform assets
        run: node tools/scripts/stage-release-assets.js release/proof-${{ matrix.label }} release/staged-${{ matrix.label }} ${{ matrix.platform }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.label }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.approved_sha }}
          path: release/staged-${{ matrix.label }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  upload-draft:
    if: inputs.upload_draft && github.ref == 'refs/heads/main' && inputs.approved_sha == github.sha
    needs: [verify-input, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.approved_sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter .
      - run: node tools/scripts/verify-release-input.js
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-windows-x64-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.approved_sha }}
          path: release/final
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-macos-arm64-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.approved_sha }}
          path: release/final
      - name: Verify both platform manifests, provenance, and hashes
        run: node tools/scripts/verify-release-assets.js release/final all
      - name: Upload or resume the exact draft without replacing assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_UPLOAD_APPROVAL: ${{ inputs.approved_sha }}
        run: node tools/scripts/upload-draft-release.js release/final
