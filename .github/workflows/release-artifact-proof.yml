name: Release artifact proof
on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact approved 0.1.1 source commit on main
        required: true
        type: string
      upload_draft:
        description: Unused; this verification never uploads release assets
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  installed-upgrade:
    if: inputs.approved_sha == 'd2b3754cdb72090db3a80868f617d2e48dc8effc' && !inputs.upload_draft
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      APPROVED_SHA: d2b3754cdb72090db3a80868f617d2e48dc8effc
      EVENT_SHA: d2b3754cdb72090db3a80868f617d2e48dc8effc
      EVENT_REF: refs/heads/main
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: d2b3754cdb72090db3a80868f617d2e48dc8effc
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: node tools/scripts/verify-release-input.js
      - run: pnpm licenses:verify
      - run: pnpm build
      - run: pnpm --filter @harness/desktop exec node scripts/build-preload.js
      - name: Package and verify the exact Windows source
        run: node tools/scripts/verify-release-assets.js --package release/proof-windows-x64 windows
      - name: Load the pinned verification harness outside the release checkout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROOF_REF: ${{ github.sha }}
        run: |
          $proofFile = Join-Path $env:RUNNER_TEMP 'windows-011-installed-upgrade-proof.mjs'
          gh api "repos/$env:GITHUB_REPOSITORY/contents/tools/scripts/windows-011-installed-upgrade-proof.mjs?ref=$env:PROOF_REF" -H 'Accept: application/vnd.github.raw+json' | Set-Content -LiteralPath $proofFile -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Beta 9 and upgrade through its real update button
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_INSTALLER: ${{ github.workspace }}/release/proof-windows-x64/TasteCode-0.1.1-win-x64.exe
        run: node (Join-Path $env:RUNNER_TEMP 'windows-011-installed-upgrade-proof.mjs')
      - name: Stage the exact tested Windows assets
        run: node tools/scripts/stage-release-assets.js release/proof-windows-x64 release/staged-windows-x64 windows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-0.1.1-windows-x64
          path: release/staged-windows-x64
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-0.1.1-installed-upgrade-proof
          path: release/installed-upgrade-proof
          if-no-files-found: warn
          retention-days: 14
