name: Release artifact proof

on:
  workflow_dispatch:

# Hosted Actions are manual so release proof never consumes minutes on a normal push.
permissions:
  contents: write

concurrency:
  group: release-artifact-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            label: windows-x64
          - os: macos-14
            platform: macos
            label: macos-arm64

    runs-on: ${{ matrix.os }}

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Build
        run: pnpm -r build

      - name: Build preload
        run: pnpm --filter @harness/desktop exec node scripts/build-preload.js

      - name: Package Windows x64
        if: matrix.platform == 'windows'
        run: pnpm --filter @harness/desktop exec electron-builder --win nsis --x64 --publish never

      - name: Package macOS Apple Silicon
        if: matrix.platform == 'macos'
        run: pnpm --filter @harness/desktop exec electron-builder --mac dmg zip --arm64 --publish never

      - name: Smoke-test unsigned Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -File -Filter 'TasteCode-*-win-x64.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'Windows installer was not created' }

          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne 'NotSigned') {
            throw "Expected an unsigned beta installer, got $($signature.Status)"
          }

          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Silent install failed with $($install.ExitCode)" }

          $installed = Join-Path $env:LOCALAPPDATA 'Programs\TasteCode\TasteCode.exe'
          if (-not (Test-Path $installed)) { throw "Installed app was not found at $installed" }

          $uninstaller = Join-Path $env:LOCALAPPDATA 'Programs\TasteCode\Uninstall TasteCode.exe'
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller was not found at $uninstaller" }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/S' -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) { throw "Silent uninstall failed with $($uninstall.ExitCode)" }

      - name: Verify macOS containers
        if: matrix.platform == 'macos'
        run: |
          dmg="$(find release -maxdepth 1 -name 'TasteCode-*-mac-arm64.dmg' -print -quit)"
          zip="$(find release -maxdepth 1 -name 'TasteCode-*-mac-arm64.zip' -print -quit)"
          test -n "$dmg" && test -n "$zip"
          hdiutil verify "$dmg"
          unzip -t "$zip"

      - name: Generate SHA-256 checksums
        run: node tools/scripts/release-checksums.js release SHA256SUMS-${{ matrix.label }}.txt

      - name: Upload to private draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v0.1.0-beta.1
        run: node tools/scripts/upload-draft-release.js release
